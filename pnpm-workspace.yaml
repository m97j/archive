packages:
  - apps/*
  - packages/*

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  unrs-resolver: true

catalog:
  "@types/node": ^24.0.0
  tsup: ^8.0.0
  typescript: 5.9.3
  vitest: ^4.0.0

minimumReleaseAgeExclude:
  - "@next/env@16.3.8"
  - "@next/eslint-plugin-next@16.3.8"
  - "@next/swc-darwin-arm64@16.3.8"
  - "@next/swc-darwin-x64@16.3.8"
  - "@next/swc-linux-arm64-gnu@16.3.8"
  - "@next/swc-linux-arm64-musl@16.3.8"
  - "@next/swc-linux-x64-gnu@16.3.8"
  - "@next/swc-linux-x64-musl@16.3.8"
  - "@next/swc-win32-arm64-msvc@16.3.8"
  - "@next/swc-win32-x64-msvc@16.3.8"
  - eslint-config-next@16.3.8
  - next@16.3.8
  - fast-uri@4.2.2

# Security floors retained until upstream dependency ranges include these fixes.
overrides:
  "fast-uri@>=3 <4": "3.1.8"
  "fast-uri@>=4 <5": "4.2.2"
  dompurify: "3.4.16"
  katex: "0.18.10"
  source-map-js: "1.2.2"
  sharp: "0.35.5"
