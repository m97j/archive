name: Deploy private HF Space

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      space_repository:
        description: Hugging Face Space owner/name
        required: true
        default: m97j/archive-core

permissions:
  contents: read

concurrency:
  group: archive-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Check out Archive
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Assemble Space build context
        run: |
          mkdir -p .hf-source/apps .hf-source/packages .hf-source/infra/huggingface
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml turbo.json tsconfig.base.json .npmrc .dockerignore .hf-source/
          cp -R apps/api apps/worker apps/cms .hf-source/apps/
          cp -R packages/contracts packages/content-engine packages/db packages/observability .hf-source/packages/
          cp infra/huggingface/Dockerfile .hf-source/Dockerfile
          cp infra/huggingface/start.mjs .hf-source/infra/huggingface/start.mjs
          cp infra/huggingface/gateway.mjs .hf-source/infra/huggingface/gateway.mjs
          cp infra/huggingface/SPACE_README.md .hf-source/README.md

      - name: Push build context to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPOSITORY: ${{ inputs.space_repository || 'm97j/archive-core' }}
        run: |
          test -n "$HF_TOKEN"
          python -m pip install huggingface-hub==1.15.0
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          repository = os.environ["HF_SPACE_REPOSITORY"]
          if repository != "m97j/archive-core":
              raise SystemExit("Production sync is restricted to m97j/archive-core")
          api = HfApi(token=os.environ["HF_TOKEN"])
          metadata = api.space_info(repository)
          if metadata.private is not True:
              raise SystemExit("archive-core deployment requires private visibility")
          source = Path(".hf-source")
          for path in source.rglob("*"):
              if not path.is_file():
                  continue
              if any(part in {"_local", "node_modules", ".git", ".next", "dist"} for part in path.parts):
                  raise SystemExit("Private/generated file in build context")
              if path.name.startswith(".env") and path.name != ".env.example":
                  raise SystemExit("Runtime environment file in build context")
              if path.name in {"AGENTS.md", "CLAUDE.md"}:
                  raise SystemExit("Local guidance file in build context")
          # Hub pre-upload selects the supported binary storage path for fonts and images.
          # No delete patterns: previous sources and their Git history remain recoverable.
          result = api.upload_folder(
              repo_id=repository, repo_type="space", folder_path=str(source),
              parent_commit=metadata.sha,
              commit_message="deploy: archive core " + os.environ["GITHUB_SHA"][:12],
          )
          print("Private Space source revision: " + result.oid)
          PY
