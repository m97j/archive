name: Provision Azure Infrastructure

on:
  push:
    branches: ["main"]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group
        run: |
          az group create --name portfolio-rg --location southeastasia

      # 1. Network
      - name: Deploy Network
        run: |
          az deployment group create \
            --resource-group portfolio-rg \
            --name network-deploy-${{ github.run_id }} \
            --template-file infra/network.bicep \
            --debug

      # 2. DNS Zones + Links
      - name: Deploy DNS Zones and Links
        run: |
          az deployment group create \
            --resource-group portfolio-rg \
            --name dns-deploy-${{ github.run_id }} \
            --template-file infra/dns.bicep \
            --parameters vnetName="portfolio-vnet" \
            --debug

      # 3. Database
      - name: Deploy Database
        run: |
          az deployment group create \
            --resource-group portfolio-rg \
            --name db-deploy-${{ github.run_id }} \
            --template-file infra/database.bicep \
            --parameters \
              postgresName="nrmx308-pg-pf" \
              postgresDbName="portfolio" \
              administratorLogin="pgadmin" \
              administratorLoginPassword="${{ secrets.POSTGRES_PASSWORD }}" \
              vnetName="portfolio-vnet" \
              pgSubnetName="pgSubnet" \
            --debug

      # 4. Storage
      - name: Deploy Storage
        run: |
          az deployment group create \
            --resource-group portfolio-rg \
            --name storage-deploy-${{ github.run_id }} \
            --template-file infra/storage.bicep \
            --parameters \
              storageAccountName="portfoliostorage3m0j8" \
              storageContainerName="portfolio-media" \
              vnetName="portfolio-vnet" \
              peSubnetName="peSubnet" \
            --debug

      # 5. Key Vault
      - name: Deploy Key Vault
        run: |
          az deployment group create \
            --resource-group portfolio-rg \
            --name kv-deploy-${{ github.run_id }} \
            --template-file infra/keyvault.bicep \
            --parameters \
              keyVaultName="portfolio-kv-3m0j8" \
              jwtSecret="${{ secrets.JWT_SECRET }}" \
              administratorLoginPassword="${{ secrets.POSTGRES_PASSWORD }}" \
              storageAccountName="portfoliostorage3m0j8" \
              vnetName="portfolio-vnet" \
              peSubnetName="peSubnet" \
            --debug

      # 6. ACR
      - name: Deploy ACR
        run: |
          az deployment group create \
            --resource-group portfolio-rg \
            --name acr-deploy-${{ github.run_id }} \
            --template-file infra/acr.bicep \
            --parameters registryName="portfolioacrn3r0m8x" \
            --debug

      # 7. Apps
      - name: Deploy Apps
        run: |
          az deployment group create \
            --resource-group portfolio-rg \
            --name app-deploy-${{ github.run_id }} \
            --template-file infra/app.bicep \
            --parameters \
              planName="test" \
              frontendAppName="portfolio-frontend" \
              backendAppName="mj-portfolio-backend" \
              registryName="portfolioacrn3r0m8x" \
              vnetName="portfolio-vnet" \
              appSubnetName="appSubnet" \
              keyVaultName="portfolio-kv-3m0j8" \
              postgresName="nrmx308-pg-pf" \
              postgresDbName="portfolio" \
              administratorLogin="pgadmin" \
              storageAccountName="portfoliostorage3m0j8" \
              storageContainerName="portfolio-media" \
            --debug

      # 8. Get Frontend Outbound IPs
      - name: Get Frontend Outbound IPs
        id: frontendIps
        run: |
          ips=$(az webapp show \
            --resource-group portfolio-rg \
            --name portfolio-frontend \
            --query possibleOutboundIpAddresses \
            --output tsv)
          echo "ips=$ips" >> $GITHUB_OUTPUT

      # 9. Deploy Access Restriction
      - name: Deploy Access Restriction
        run: |
          az deployment group create \
            --resource-group portfolio-rg \
            --name access-deploy-${{ github.run_id }} \
            --template-file infra/access-restriction.bicep \
            --parameters \
              backendAppName="mj-portfolio-backend" \
              frontendOutboundIps="${{ steps.frontendIps.outputs.ips }}" \
            --debug

#
